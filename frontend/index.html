<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Review Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div>
            <h1>Student Project Review Board</h1>
            <p id="welcomeText">Login to continue</p>
        </div>
        <button id="logoutBtn" class="secondary hidden" onclick="logout()">Logout</button>
    </header>

    <main>
        <section id="authSection" class="auth-layout">
            <form class="panel" id="loginForm">
                <h2>Login</h2>
                <div class="role-toggle">
                    <label><input type="radio" name="loginRole" value="student" checked> Student</label>
                    <label><input type="radio" name="loginRole" value="faculty"> Faculty</label>
                </div>
                <input type="email" id="loginEmail" placeholder="Email address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form class="panel" id="registerForm">
                <h2>Create Account</h2>
                <div class="role-toggle">
                    <label><input type="radio" name="registerRole" value="student" checked> Student</label>
                    <label><input type="radio" name="registerRole" value="faculty"> Faculty</label>
                </div>
                <input type="text" id="registerName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email address" required>
                <input type="text" id="registerQualification" placeholder="Qualification" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </section>

        <section id="appSection" class="hidden">
            <div class="dashboard">
                <div class="dashboard-card">
                    <h3>Total Projects</h3>
                    <p id="totalProjects">0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Reviewed</h3>
                    <p id="reviewedProjectsCount">0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Pending</h3>
                    <p id="pendingProjectsCount">0</p>
                </div>
            </div>

            <form id="uploadForm" class="panel hidden">
                <h2>Upload Project</h2>
                <input type="text" id="projectTitle" placeholder="Project name" required>
                <input type="text" id="technology" placeholder="Technology used" required>
                <textarea id="description" placeholder="Project description"></textarea>
                <button type="submit">Submit Project</button>
            </form>

            <section class="content-section">
                <h2 id="projectListTitle">Projects</h2>
                <div id="projectContainer" class="project-grid"></div>
            </section>

            <section id="adminPanel" class="content-section hidden">
                <h2>Admin Overview</h2>
                <div id="userContainer" class="user-grid"></div>
            </section>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Built by Rashmika</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
