<!DOCTYPE html>
<html>
<head>
    <title>Student Project Review Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">🎓 Student Project Review Board</h1>

    <div class="dashboard">

        <div class="dashboard-card">
            <h3>Total Projects</h3>
            <p id="totalProjects">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Reviewed</h3>
            <p id="reviewedProjectsCount">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Pending</h3>
            <p id="pendingProjectsCount">0</p>
        </div>

    </div>

    <!-- MAIN PROJECT LIST -->
    <div id="projectContainer"></div>

    <!-- REVIEWED PROJECTS -->
    
    <div id="reviewedProjects"></div>

    <script src="script.js"></script>
<footer class="footer">
    <p>© 2026 Built by Rashmika</p>
</footer>
</body>
</html>
